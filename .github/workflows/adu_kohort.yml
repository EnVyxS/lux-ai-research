name: adu kohort

on:
  push:
    paths:
      - 'lux_ai/serapan/adu_kohort.py'
      - '.github/workflows/adu_kohort.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tunggal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Kegagalan DILARANG bisu. Log dibuat lebih dulu supaya ia selalu ada
      # untuk di-commit, walau modulnya gagal pada baris pertama.
      - name: siapkan jejak
        run: |
          mkdir -p reports
          : > reports/adu_kohort.log
          echo "mulai $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> reports/adu_kohort.log
          python -V >> reports/adu_kohort.log 2>&1
          ls -l reports/funding_semesta.json reports/kehidupan.json \
            reports/kohort_ekor.json >> reports/adu_kohort.log 2>&1 || true

      - name: adu keanggotaan kohort
        id: jalan
        run: |
          set +e
          python -m lux_ai.serapan.adu_kohort >> reports/adu_kohort.log 2>&1
          kode=$?
          echo "kode=$kode" >> "$GITHUB_OUTPUT"
          echo "kode_keluar=$kode" >> reports/adu_kohort.log
          ls -l reports/adu_kohort.json >> reports/adu_kohort.log 2>&1 || \
            echo "laporan TIDAK lahir" >> reports/adu_kohort.log
          tail -n 80 reports/adu_kohort.log
          exit 0

      - name: tulis status
        if: always()
        env:
          KODE: ${{ steps.jalan.outputs.kode }}
        run: |
          python - <<'PY'
          import datetime, json, os

          try:
              byte = os.path.getsize("reports/adu_kohort.json")
          except OSError:
              byte = 0

          status = {
              "run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "commit": os.environ.get("GITHUB_SHA", ""),
              "kode_keluar": int(os.environ.get("KODE", "1") or 1),
              "byte_laporan": byte,
              "laporan_lahir": byte > 0,
              "waktu_utc": datetime.datetime.now(datetime.timezone.utc).strftime(
                  "%Y-%m-%dT%H:%M:%SZ"
              ),
          }
          with open("reports/adu_kohort_status.json", "w", encoding="utf-8") as f:
              json.dump(status, f, ensure_ascii=False, indent=2, sort_keys=True)
              f.write("\n")
          PY

      # add per berkas: satu berkas yang tidak ada TIDAK boleh menggagalkan
      # seluruh add, sebab itulah yang membuat kegagalan menjadi bisu.
      - name: commit laporan
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f reports/adu_kohort.log || true
          git add -f reports/adu_kohort_status.json || true
          git add -f reports/adu_kohort.json || true
          git commit -m "laporan adu kohort run ${GITHUB_RUN_ID} [skip ci]" || exit 0
          for i in 1 2 3 4 5 6 7 8; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep $((i * 5))
          done

      - name: kode keluar
        run: exit ${{ steps.jalan.outputs.kode }}
