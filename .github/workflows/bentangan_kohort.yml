name: bentangan kohort

on:
  push:
    paths:
      - 'lux_ai/serapan/bentangan_kohort.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tunggal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: bentangan kehidupan seluruh anggota kohort ekor
        id: jalan
        run: |
          set +e
          mkdir -p reports
          python -m lux_ai.serapan.bentangan_kohort 2>&1 | tee reports/bentangan_kohort.log
          kode=${PIPESTATUS[0]}
          echo "kode=$kode" >> "$GITHUB_OUTPUT"
          exit 0

      - name: tulis status
        env:
          KODE: ${{ steps.jalan.outputs.kode }}
        run: |
          python - <<'PY'
          import datetime, json, os

          status = {
              "run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "commit": os.environ.get("GITHUB_SHA", ""),
              "kode_keluar": int(os.environ.get("KODE", "1") or 1),
              "waktu_utc": datetime.datetime.now(datetime.timezone.utc).strftime(
                  "%Y-%m-%dT%H:%M:%SZ"
              ),
          }
          with open("reports/bentangan_kohort_status.json", "w", encoding="utf-8") as f:
              json.dump(status, f, ensure_ascii=False, indent=2, sort_keys=True)
              f.write("\n")
          PY

      - name: commit laporan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f reports/bentangan_kohort.json reports/bentangan_kohort.log reports/bentangan_kohort_status.json || true
          git commit -m "laporan bentangan kohort run ${GITHUB_RUN_ID} [skip ci]" || exit 0
          for i in 1 2 3 4 5 6 7 8; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep $((i * 5))
          done

      - name: kode keluar
        run: exit ${{ steps.jalan.outputs.kode }}
