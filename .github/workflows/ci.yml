name: ci

on:
  push:
    paths-ignore:
      - 'journal/**'
      - 'decisions/**'
      - 'hipotesis/**'
      - 'reports/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  uji:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: pasang dependensi
        run: python -m pip install -r requirements.txt

      - name: cacah uji (dicetak SEBELUM pytest)
        run: python -m pytest --collect-only -q | tail -n 3

      - name: jalankan uji, tulis laporan, commit, baru tegakkan
        run: |
          set +e
          python -m pytest -q > hasil.txt 2>&1
          kode=$?
          set -e
          mkdir -p reports
          cacah=$(python -m pytest --collect-only -q 2>/dev/null | tail -n 1)
          printf '{\n' > reports/ci_terakhir.json
          printf '  "run_id": "%s",\n' "${GITHUB_RUN_ID}" >> reports/ci_terakhir.json
          printf '  "commit": "%s",\n' "${GITHUB_SHA}" >> reports/ci_terakhir.json
          printf '  "waktu_utc": "%s",\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> reports/ci_terakhir.json
          printf '  "kode_keluar": %s,\n' "${kode}" >> reports/ci_terakhir.json
          printf '  "cacah_uji": "%s"\n' "${cacah}" >> reports/ci_terakhir.json
          printf '}\n' >> reports/ci_terakhir.json
          cp hasil.txt reports/ci_terakhir.txt
          git config user.name 'lux-ci'
          git config user.email 'lux-ci@users.noreply.github.com'
          git add reports/ci_terakhir.json reports/ci_terakhir.txt
          git commit -m "laporan CI ${GITHUB_RUN_ID} [skip ci]" || echo 'tidak ada perubahan laporan'
          git pull --rebase --autostash
          git push
          exit ${kode}
