name: irisan byte

on:
  push:
    paths:
      - 'lux_ai/serapan/irisan_byte.py'

permissions:
  contents: write

jobs:
  ukur:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: pasang
        run: pip install numpy pandas pyarrow pyyaml

      - name: jalan
        id: jalan
        run: |
          set +e
          python -m lux_ai.serapan.irisan_byte
          KODE=$?
          echo "kode=$KODE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: catat status
        if: always()
        run: |
          mkdir -p reports
          printf '{\n  "modul": "irisan_byte",\n  "kode": "%s",\n  "run_id": "%s",\n  "sha": "%s"\n}\n' "${{ steps.jalan.outputs.kode }}" "${{ github.run_id }}" "${{ github.sha }}" > reports/irisan_byte_status.json

      - name: dorong laporan
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/irisan_byte.json reports/irisan_byte_status.json || true
          git commit -m "laporan irisan_byte [skip ci]" || echo "tidak ada perubahan"
          git pull --rebase || true
          git push || true

      - name: kode keluar
        if: always()
        run: exit ${{ steps.jalan.outputs.kode }}
