name: peta manifes

on:
  push:
    paths:
      - 'lux_ai/serapan/peta_manifes.py'
      - '.github/workflows/peta_manifes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tunggal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: sensus simbol-bulan dari manifes
        id: jalan
        run: |
          set +e
          mkdir -p reports
          python -m lux_ai.serapan.peta_manifes > reports/peta_manifes.log 2>&1
          kode=$?
          echo "kode=$kode" >> "$GITHUB_OUTPUT"
          tail -n 60 reports/peta_manifes.log
          exit 0

      - name: tulis status
        env:
          KODE: ${{ steps.jalan.outputs.kode }}
        run: |
          python - <<'PY'
          import datetime, json, os

          byte = 0
          try:
              byte = os.path.getsize("reports/peta_manifes.json")
          except OSError:
              byte = 0

          status = {
              "run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "commit": os.environ.get("GITHUB_SHA", ""),
              "kode_keluar": int(os.environ.get("KODE", "1") or 1),
              "byte_laporan": byte,
              "waktu_utc": datetime.datetime.now(datetime.timezone.utc).strftime(
                  "%Y-%m-%dT%H:%M:%SZ"
              ),
          }
          with open("reports/peta_manifes_status.json", "w", encoding="utf-8") as f:
              json.dump(status, f, ensure_ascii=False, indent=2, sort_keys=True)
              f.write("\n")
          PY

      - name: commit laporan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f reports/peta_manifes.json reports/peta_manifes.log reports/peta_manifes_status.json || true
          git commit -m "laporan peta manifes run ${GITHUB_RUN_ID} [skip ci]" || exit 0
          for i in 1 2 3 4 5 6 7 8; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep $((i * 5))
          done

      - name: kode keluar
        run: exit ${{ steps.jalan.outputs.kode }}
