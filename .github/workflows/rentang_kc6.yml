name: rentang-kc6

# Aturan 33 dan 34: pemicu-diri dicabut (biaya 300 menit), add hanya berkas
# berawalan rentang_kc6.
on:
  push:
    paths:
      - 'lux_ai/serapan/rentang_kc6.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rentang-kc6
  cancel-in-progress: false

jobs:
  rentang:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: pasang kebutuhan
        run: pip install -r requirements.txt
      - name: jalankan pengukuran rentang KC-6
        run: |
          set +e
          python -m lux_ai.serapan.rentang_kc6 > rentang.log 2>&1
          kode=$?
          mkdir -p reports
          tail -c 20000 rentang.log > reports/rentang_kc6.log
          printf '{\n  "run_id": "%s",\n  "commit": "%s",\n  "kode_keluar": %s,\n  "waktu_utc": "%s"\n}\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" "$kode" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > reports/rentang_kc6_status.json
          git config user.name lux-ci
          git config user.email lux-ci@users.noreply.github.com
          git add reports/rentang_kc6.json 2>/dev/null || true
          git add reports/rentang_kc6.log reports/rentang_kc6_status.json
          git commit -m "laporan rentang kc6 ${GITHUB_RUN_ID} [skip ci]" || echo "tidak ada perubahan"
          git pull --rebase --autostash
          git push
          exit 0
