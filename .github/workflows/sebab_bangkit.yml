name: sebab bangkit

on:
  push:
    paths:
      - 'lux_ai/serapan/sebab_bangkit.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tunggal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: pasangkan kematian dengan lubang funding pada simbol bangkit
        id: jalan
        run: |
          set +e
          mkdir -p reports
          python -m lux_ai.serapan.sebab_bangkit 2>&1 | tee reports/sebab_bangkit.log
          kode=${PIPESTATUS[0]}
          echo "kode=$kode" >> "$GITHUB_OUTPUT"
          exit 0

      - name: tulis status
        if: always()
        env:
          KODE: ${{ steps.jalan.outputs.kode }}
        run: |
          mkdir -p reports
          python - <<'PY'
          import datetime, json, os

          status = {
              "run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "commit": os.environ.get("GITHUB_SHA", ""),
              "kode_keluar": int(os.environ.get("KODE", "1") or 1),
              "waktu_utc": datetime.datetime.now(datetime.timezone.utc).strftime(
                  "%Y-%m-%dT%H:%M:%SZ"
              ),
          }
          with open("reports/sebab_bangkit_status.json", "w", encoding="utf-8") as f:
              json.dump(status, f, ensure_ascii=False, indent=2, sort_keys=True)
              f.write("\n")
          PY

      # KC-44: `git add -f a b c` bersifat semua-atau-tidak-ada, sehingga satu
      # berkas hilang membuat run gagal tidak meninggalkan jejak apa pun. Karena
      # itu setiap berkas ditambahkan SENDIRI-SENDIRI.
      - name: commit laporan
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for berkas in reports/sebab_bangkit.json reports/sebab_bangkit.log reports/sebab_bangkit_status.json; do
            if [ -f "$berkas" ]; then
              git add -f "$berkas" || true
            else
              echo "tidak ada: $berkas"
            fi
          done
          git commit -m "laporan sebab bangkit run ${GITHUB_RUN_ID} [skip ci]" || exit 0
          for i in 1 2 3 4 5 6 7 8; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep $((i * 5))
          done

      - name: kode keluar
        run: exit ${{ steps.jalan.outputs.kode }}
