name: semesta silang

on:
  push:
    paths:
      - 'lux_ai/serapan/semesta_silang.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  jalan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: jalan
        id: jalan
        run: |
          mkdir -p reports
          set +e
          python -m lux_ai.serapan.semesta_silang 2>&1 | tee reports/semesta_silang.log
          kode=${PIPESTATUS[0]}
          set -e
          echo "kode=$kode" >> $GITHUB_OUTPUT
      - name: tulis status
        if: always()
        env:
          KODE: ${{ steps.jalan.outputs.kode }}
        run: |
          python - <<'PY'
          import json
          import os

          status = {
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "commit": os.environ.get("GITHUB_SHA"),
              "kode_keluar": os.environ.get("KODE"),
          }
          with open("reports/semesta_silang_status.json", "w", encoding="utf-8") as f:
              json.dump(status, f, ensure_ascii=False, indent=2, sort_keys=True)
              f.write("\n")
          PY
      - name: commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f reports/semesta_silang.json reports/semesta_silang_ringkas.json reports/semesta_silang_status.json reports/semesta_silang.log || true
          git commit -m "laporan semesta silang run ${GITHUB_RUN_ID} [skip ci]" || exit 0
          for i in $(seq 1 8); do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep 5
          done
      - name: kode keluar
        if: always()
        run: exit ${{ steps.jalan.outputs.kode }}
