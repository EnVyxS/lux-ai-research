name: taksonomi-semesta

on:
  push:
    branches: [main]
    paths:
      - lux_ai/semesta/taksonomi.py
      - .github/workflows/taksonomi_semesta.yml
  workflow_dispatch:

concurrency:
  group: taksonomi-semesta
  cancel-in-progress: false

jobs:
  jalankan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: jalankan taksonomi
        run: python -m lux_ai.semesta.taksonomi
      - name: commit berkas bernama saja
        run: |
          git config user.name lux-ci
          git config user.email lux-ci@users.noreply.github.com
          git add reports/taksonomi_semesta.json
          git diff --cached --quiet || git commit -m "laporan taksonomi semesta [skip ci]"
          git pull --rebase --autostash
          git push
