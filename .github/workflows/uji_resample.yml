name: uji-resample

on:
  push:
    paths:
      - 'lux_ai/serapan/resample.py'
      - 'lux_ai/serapan/uji_resample.py'
      - 'lux_ai/serapan/klines.py'
      - '.github/workflows/uji_resample.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: uji-resample
  cancel-in-progress: false

jobs:
  resample:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: pasang kebutuhan
        run: pip install -r requirements.txt
      - name: jalankan uji integritas resample
        run: |
          set +e
          python -m lux_ai.serapan.uji_resample > resample.log 2>&1
          kode=$?
          mkdir -p reports
          tail -c 20000 resample.log > reports/uji_resample.log
          printf '{\n  "run_id": "%s",\n  "commit": "%s",\n  "kode_keluar": %s,\n  "waktu_utc": "%s"\n}\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" "$kode" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > reports/uji_resample_status.json
          git config user.name lux-ci
          git config user.email lux-ci@users.noreply.github.com
          git add reports
          git commit -m "laporan uji resample ${GITHUB_RUN_ID} [skip ci]" || echo "tidak ada perubahan"
          git pull --rebase --autostash
          git push
          exit $kode
